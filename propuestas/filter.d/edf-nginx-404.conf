# Filtro de la jaula nginx-404 (ver ../fail2ban.local). Log de nginx en formato combined.
# fail2ban quita la fecha de la línea antes de comparar; por eso queda "\[\]".
# Validado con fail2ban-regex 1.0.2 sobre incidente/nginx-access.log: 147 líneas de 44 IP;
# el ignoreregex descarta las 17 de /sitemap.xml del bot.

[Definition]
failregex = ^<HOST> \S+ \S+ \[\] "[A-Z]+ \S+ HTTP/[0-9.]+" 404\b
# Las únicas 404 legítimas del log son 17 a /sitemap.xml (RastreadorBot, p. ej. W139, W159).
ignoreregex = "[A-Z]+ /sitemap\.xml[ ?]
