# Filtro de la jaula nginx-sondeo (ver ../fail2ban.local). Log de nginx en formato combined.
# fail2ban quita la fecha de la línea antes de comparar; por eso queda "\[\]".
# Validado con fail2ban-regex 1.0.2 sobre incidente/nginx-access.log: 147 líneas de 44 IP,
# ninguna interna ni del verificador ni del bot.

[Definition]
failregex = ^<HOST> \S+ \S+ \[\] "[A-Z]+ /(?:\.env|\.git/|\.aws/|wp-login\.php|xmlrpc\.php|phpmyadmin/|vendor/phpunit/|cgi-bin/|actuator/|server-status|backup\.zip|config\.json|admin/login|api/v1/users)\S* HTTP/[0-9.]+" \d{3}\b
ignoreregex =
